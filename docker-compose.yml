name: icr-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - icr_backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - icr_backend

  s3:
    image: motoserver/moto:5.2.3
    restart: unless-stopped
    command: ["-H", "0.0.0.0", "-p", "9000"]
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
    networks:
      - icr_backend

  s3-init:
    build:
      context: .
      dockerfile: docker/s3-init.Dockerfile
    restart: "no"
    depends_on:
      s3:
        condition: service_started
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET:-icr-platform-local}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    networks:
      - icr_backend

volumes:
  postgres_data:
  redis_data:

networks:
  icr_backend:
    driver: bridge
